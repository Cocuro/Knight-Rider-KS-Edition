<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-immersive" />
  <meta name="apple-mobile-web-app-title" content="Knight Rider KS" />
  <meta name="theme-color" content="#0f0f1a" />
  <title>Knight Rider KS edition</title>

  <!-- PWA manifest inline -->
  <link rel="manifest" href="manifest.json" />

  <!-- Icono generado como SVG inline en base64 -->
  <link rel="apple-touch-icon" href="icon.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0f0f1a;
      --accent: #cc2020;
      --accent2: #ff6b00;
      --text: #e2e8f0;
      --text-dim: #64748b;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ── SPLASH SCREEN ── */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 100;
      transition: opacity 0.5s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 0 40px rgba(124, 58, 237, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(124, 58, 237, 0.4); }
      50% { box-shadow: 0 0 60px rgba(6, 182, 212, 0.5); }
    }

    .splash-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .splash-subtitle {
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    .loader {
      width: 180px;
      height: 3px;
      background: #1e1e30;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }

    .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* ── ORIENTACIÓN ── */
    #rotate-hint {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 90;
    }

    #rotate-hint .icon {
      font-size: 56px;
      animation: rotate-anim 2s ease-in-out infinite;
    }

    @keyframes rotate-anim {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(90deg); }
      60% { transform: rotate(90deg); }
    }

    #rotate-hint p {
      color: var(--text);
      font-size: 16px;
      text-align: center;
      max-width: 240px;
    }

    /* ── GAME CONTAINER ── */
    #game-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #game-frame {
      border: none;
      display: block;
      /* Scratch canvas es 480×360. Escalamos manteniendo ratio */
      width: 100%;
      height: 100%;
    }

    /* ── BANNER "AÑADIR A INICIO" (iOS) ── */
    #install-banner {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1a1a2e;
      border-top: 1px solid #2a2a4a;
      padding: 14px 20px 20px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
      animation: slide-up 0.3s ease;
    }

    @keyframes slide-up {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    #install-banner p {
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    #install-banner strong {
      color: var(--accent2);
    }

    #install-banner .banner-actions {
      display: flex;
      gap: 10px;
    }

    #install-banner button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #install-banner .btn-install {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
    }

    #install-banner .btn-dismiss {
      background: #2a2a4a;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="splash-icon">🚗</div>
    <div class="splash-title">Knight Rider KS edition</div>
    <div class="splash-subtitle">por KS · Cargando…</div>
    <div class="loader"><div class="loader-bar" id="loader-bar"></div></div>
  </div>

  <!-- Hint rotar pantalla (si el juego es mejor en horizontal) -->
  <!-- Descomenta el bloque de abajo si quieres forzar landscape
  <div id="rotate-hint">
    <div class="icon">📱</div>
    <p>Gira el móvil para jugar mejor</p>
  </div>
  -->

  <!-- Juego -->
  <div id="game-wrap">
    <iframe
      id="game-frame"
      src="https://scratch.mit.edu/projects/1325306432/embed"
      allowtransparency="true"
      allowfullscreen
      allow="autoplay; fullscreen *; geolocation; microphone; camera; midi; monetization; xr-spatial-tracking; gamepad; gyroscope; accelerometer; xr"
      scrolling="no"
      frameborder="0"
    ></iframe>
  </div>

  <!-- Banner iOS "Añadir a inicio" -->
  <div id="install-banner">
    <p>Añade el juego a tu pantalla de inicio para abrirlo <strong>como una app</strong>, sin barras del navegador.</p>
    <p>Pulsa <strong>Compartir ↑</strong> y luego <strong>"Añadir a pantalla de inicio"</strong></p>
    <div class="banner-actions">
      <button class="btn-install" onclick="dismissBanner()">Entendido ✓</button>
      <button class="btn-dismiss" onclick="dismissBanner()">Ahora no</button>
    </div>
  </div>

  <script>
    // ── Barra de carga falsa (el iframe carga en paralelo) ──
    const bar = document.getElementById('loader-bar');
    const splash = document.getElementById('splash');
    let progress = 0;

    const interval = setInterval(() => {
      progress += Math.random() * 18;
      if (progress >= 90) { progress = 90; clearInterval(interval); }
      bar.style.width = progress + '%';
    }, 200);

    // Cuando el iframe carga, completamos y ocultamos splash
    document.getElementById('game-frame').addEventListener('load', () => {
      clearInterval(interval);
      bar.style.width = '100%';
      setTimeout(() => { splash.classList.add('hidden'); }, 600);
    });

    // Fallback: ocultar splash a los 6 segundos pase lo que pase
    setTimeout(() => { splash.classList.add('hidden'); }, 6000);

    // ── Escalar el iframe manteniendo ratio 4:3 de Scratch (480x360) ──
    function resizeGame() {
      const wrap = document.getElementById('game-wrap');
      const frame = document.getElementById('game-frame');
      const ww = window.innerWidth;
      const wh = window.innerHeight;
      const ratio = 480 / 360; // Scratch canvas ratio

      let w, h;
      if (ww / wh > ratio) {
        h = wh;
        w = h * ratio;
      } else {
        w = ww;
        h = w / ratio;
      }

      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
    }

    resizeGame();
    window.addEventListener('resize', resizeGame);
    window.addEventListener('orientationchange', () => {
      setTimeout(resizeGame, 300);
    });

    // ── Banner iOS: mostrar si es Safari móvil y no está en standalone ──
    function isIosSafari() {
      const ua = navigator.userAgent;
      return /iP(hone|ad)/.test(ua) && /WebKit/.test(ua) && !/CriOS|FxiOS|OPiOS|EdgiOS/.test(ua);
    }

    function isStandalone() {
      return window.navigator.standalone === true ||
             window.matchMedia('(display-mode: standalone)').matches;
    }

    function dismissBanner() {
      document.getElementById('install-banner').style.display = 'none';
      localStorage.setItem('banner-dismissed', '1');
    }

    window.addEventListener('load', () => {
      if (isIosSafari() && !isStandalone() && !localStorage.getItem('banner-dismissed')) {
        setTimeout(() => {
          document.getElementById('install-banner').style.display = 'flex';
        }, 3000);
      }
    });

    // ── Android: capturar evento beforeinstallprompt ──
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // En Android mostramos el banner también
      if (!localStorage.getItem('banner-dismissed')) {
        setTimeout(() => {
          const banner = document.getElementById('install-banner');
          banner.querySelector('p:first-child').innerHTML =
            'Instala el juego en tu móvil para abrirlo <strong>como una app</strong>.';
          banner.querySelector('p:nth-child(2)').innerHTML = '';
          banner.querySelector('.btn-install').textContent = 'Instalar ✓';
          banner.querySelector('.btn-install').onclick = async () => {
            deferredPrompt.prompt();
            dismissBanner();
          };
          banner.style.display = 'flex';
        }, 3000);
      }
    });
  </script>
</body>
</html>
